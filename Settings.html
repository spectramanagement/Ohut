<body> 

<div class="settingDetails">

<a href="home.html"><div class="BckBtn">Back</div> </a>

<div class="profileDetails">
<img id="profile-image" src="" alt="Profile Image"/>
</div>

<input type="file" class="profile" accept="image/*" id="profile-upload">

<button class="saveBtn" onclick="saveValue()">Save</button>
<div class="settingBox">
<button id="userNameBtn">Change Username</button>
<div id="userNameView" style="display: none" >
<input type="text" id="userName" placeholder="username">

</div> 

<button id="userNameBtn1"> Email/Phone number</button>
<div id="userNameView1" style="display: none" >

<input type="text" id="mail" placeholder="Email">
<input type="number" id="number" placeholder="Phone Number">

</div>



<button id="changePasswordBtn">Change Password</button>
<div class="password" id="changePassword"style="display: none">
<input type="password" id="password" placeholder="New Password">
<input type="password" id="Confirmpassword" placeholder="Confirm Password">
</div>

<button id="accountDetailsBtn">Link Withdrawal Details</button>
<div id="accountDetailsView" style="display: none">
<input type="number" id="AcctNumber" placeholder="Account Number">
<input type="text" id="AcctBank" placeholder="Bank">
<input type="tect" id="AcctName" placeholder="Account Name">

</div>



<a href="2fa.html"><button > Two authentication factor </button> </a> 
</div>
</div>
<script>


// Profile Picture
document.getElementById('profile-upload').addEventListener('change', function() {
  const file = this.files[0];
  // You can add code here to upload the file or display it
});

// Change Username
document.getElementById('userNameBtn').addEventListener('click', function() {
  const userNameView = document.getElementById('userNameView');
  userNameView.style.display = userNameView.style.display === 'block' ? 'none' : 'block';
});

function saveValue() {
  const userName = document.getElementById('userName').value;
  localStorage.setItem('userName', userName);
  alert('Username saved successfully!');
}

// Email/Phone Number
document.getElementById('userNameBtn1').addEventListener('click', function() {
  const userNameView1 = document.getElementById('userNameView1');
  userNameView1.style.display = userNameView1.style.display === 'block' ? 'none' : 'block';
});

document.getElementById('userNameView1').addEventListener('input', function() {
  const mail = document.getElementById('mail').value;
  const number = document.getElementById('number').value;
  localStorage.setItem('mail', mail);
  localStorage.setItem('number', number);
});

// Change Password
document.getElementById('changePasswordBtn').addEventListener('click', function() {
  const changePassword = document.getElementById('changePassword');
  changePassword.style.display = changePassword.style.display === 'block' ? 'none' : 'block';
});

document.getElementById('changePassword').addEventListener('input', function() {
  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('Confirmpassword').value;
  if (password === confirmPassword) {
    localStorage.setItem('password', password);
  } else {
    alert('Passwords do not match!');
  }
});

// Account Details
document.getElementById('accountDetailsBtn').addEventListener('click', function() {
  const accountDetailsView = document.getElementById('accountDetailsView');
  accountDetailsView.style.display = accountDetailsView.style.display === 'block' ? 'none' : 'block';
});

document.getElementById('accountDetailsView').addEventListener('input', function() {
  const acctNumber = document.getElementById('AcctNumber').value;
  const acctBank = document.getElementById('AcctBank').value;
  const acctName = document.getElementById('AcctName').value;
  localStorage.setItem('acctNumber', acctNumber);
  localStorage.setItem('acctBank', acctBank);
  localStorage.setItem('acctName', acctName);
});

// Load saved values
window.onload = function() {
  const userName = localStorage.getItem('userName');
  const mail = localStorage.getItem('mail');
  const number = localStorage.getItem('number');
  const password = localStorage.getItem('password');
  const acctNumber = localStorage.getItem('acctNumber');
  const acctBank = localStorage.getItem('acctBank');
  const acctName = localStorage.getItem('acctName');

  if (userName) {
    document.getElementById('userName').value = userName;
  }
  if (mail) {
    document.getElementById('mail').value = mail;
  }
  if (number) {
    document.getElementById('number').value = number;
  }
  if (password) {
    document.getElementById('password').value = password;
    document.getElementById('Confirmpassword').value = password;
  }
  if (acctNumber) {
    document.getElementById('AcctNumber').value = acctNumber;
  }
  if (acctBank) {
    document.getElementById('AcctBank').value = acctBank;
  }
  if (acctName) {
    document.getElementById('AcctName').value = acctName;
  }
};


document.getElementById('profile-upload').addEventListener('change', function() {
  const profileImage = document.getElementById('profile-image');
  if (this.files.length > 0) {
    const file = this.files[0];
    const reader = new FileReader();
    reader.onload = function(event) {
      const imageData = event.target.result;
      localStorage.setItem('profileImageData', imageData);
      profileImage.src = imageData;
      profileImage.classList.add('uploaded');
    };
    reader.readAsDataURL(file);
  } else {
    localStorage.removeItem('profileImageData');
    profileImage.src = '';
    profileImage.classList.remove('uploaded');
  }
});

// Load saved image
const savedImageData = localStorage.getItem('profileImageData');
if (savedImageData) {
  const profileImage = document.getElementById('profile-image');
  profileImage.src = savedImageData;
  profileImage.classList.add('uploaded');
}

</script>
