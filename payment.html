<script>


// Initialize variables
let availableBalance = 0;
let investmentBalance = 0;
let transactions = [];

// Package buttons event listeners
const packageBtns = document.querySelectorAll('.package-btn');
packageBtns.forEach(btn => {
    btn.addEventListener('click', () => {
        const packageAmount = btn.getAttribute('data-amount');
        // Deduct package amount from available balance
        availableBalance -= parseInt(packageAmount);
        document.getElementById('available-balance').textContent = availableBalance;
        // Add transaction to history
        transactions.push(`Package purchased: ${packageAmount}`);
        updateTransactionsList();
    });
});

// Upload payment receipt event listener
document.getElementById('upload-btn').addEventListener('click', () => {
    const receiptUpload = document.getElementById('receipt-upload');
    // Send receipt to master end for approval
    // For demonstration purposes, we'll just log the file
    console.log(receiptUpload.files[0]);
});

// Deposit event listener
document.getElementById('deposit-btn').addEventListener('click', () => {
    const depositAmount = parseInt(document.getElementById('deposit-amount').value);
    // Increase available balance
    availableBalance += depositAmount;
    document.getElementById('available-balance').textContent = availableBalance;
    // Add transaction to history
    transactions.push(`Deposit: ${depositAmount}`);
    updateTransactionsList();
});

// Withdrawal event listener
document.getElementById('withdrawal-btn').addEventListener('click', () => {
    document.getElementById('withdrawal-input').style.display = 'block';
});

document.getElementById('withdrawal-submit').addEventListener('click', () => {
    const withdrawalAmount = parseInt(document.getElementById('withdrawal-amount').value);
    if (withdrawalAmount < availableBalance * 1.5) {
        alert('Not enough balance to withdraw');
    } else {
        // Send notification to master end for approval
        // For demonstration purposes, we'll just log the amount
        console.log(`Withdrawal request: ${withdrawalAmount}`);
    }
});

// Update transactions list
function updateTransactionsList() {
    const transactionsList = document.getElementById('transactions-list');
    transactionsList.innerHTML = '' + "Pending";
    transactions.forEach(transaction => {
        const li = document.createElement('li');
        li.textContent = transaction;
        transactionsList.appendChild(li);
    });
}

// Increase available balance by 10% every 24 hours
setInterval(() => {
    availableBalance *= 1.1;
    document.getElementById('available-balance').textContent = availableBalance;
}, 24 * 60 * 60 * 1000); // 24 hours

</script>
