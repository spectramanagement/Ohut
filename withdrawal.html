<div class="depositAcct">
<div class="depositAlign">
        <section id="deposit">
            <h4>Withdrawal Details</h4>
<p id="result"></p>
            <input type="number" id="withdrawAmt" placeholder="Enter amount" required>
           

 <input type="number" id="withdrawAcct" placeholder="Account Number" required>

 <input type="text" id="withdrawBank" placeholder="Bank" required>

 <input type="text" id="withdrawName" placeholder="Account Name" required>

 <button onclick="withdrawalDetails()">Next</button>
        </section>

    </main>

<script>

function withdrawalDetails() {
  const interestBln = parseFloat(localStorage.getItem('interestBln'));
  const withdrawAmt = parseFloat(document.getElementById('withdrawAmt').value);
  const withdrawName = document.getElementById('withdrawName').value;
  const withdrawBank = document.getElementById('withdrawBank').value;
  const withdrawAcct = document.getElementById('withdrawAcct').value;

  if (isNaN(withdrawAmt)) {
    document.getElementById('result').innerText = 'Please enter a valid amount';
  } else if (withdrawAmt < 50) {
    document.getElementById('result').innerText = 'Minimum withdrawal amount is 50';
  } else if (withdrawAmt > interestBln) {
    window.location.href = 'Unsuccessful.html';
  } else if (withdrawName === '' || withdrawBank === '' || withdrawAcct === '') {
    document.getElementById('result').innerText = 'Please fill out all fields';
  } else {
    const newInterestBln = interestBln - withdrawAmt;
    localStorage.setItem('interestBln', newInterestBln); 
    localStorage.setItem('withdrawAmt', withdrawAmt);
    localStorage.setItem('withdrawName', withdrawName);
    localStorage.setItem('withdrawBank', withdrawBank);
    localStorage.setItem('withdrawAcct', withdrawAcct);
    document.getElementById('withdrawAmt').value = ''; // Clear the input field
    window.location.href = 'packageSuccessful';
  }
}

</script>
