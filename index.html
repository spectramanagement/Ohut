
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="keywords" content="HTML, CSS">
  <meta name="description" content="...">
  <title> Home </title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" >
</head>
<body>
  <!-- Signin Form -->
  <div id="signin-form">
    <h2>Signin</h2>
    <input type="email" id="signin-email" placeholder="Email">
    <input type="password" id="signin-password" placeholder="Password">
    <button id="signin-btn">Signin</button>
    <p>Don't have an account? <a href="#" id="show-signup-form">Signup</a></p>
  </div>
  <!-- Signup Form -->
  <div id="signup-form" style="display: none;">
    <h2>Signup</h2>
    <input type="email" id="signup-email" placeholder="Email">
    <input type="password" id="signup-password" placeholder="Password">
    <input type="password" id="signup-confirm-password" placeholder="Confirm Password">
    <button id="signup-btn">Signup</button>
    <p>Already have an account? <a href="#" id="show-signin-form">Signin</a></p>
  </div>

  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.6.1/firebase-database.js"></script>

  <script>
    
const firebaseConfig = {
  apiKey: "AIzaSyCWJ8u2MGdC98r4ij_SZz9DkcqnGXcwOZU",
  authDomain: "ohut-7a131.firebaseapp.com",
  databaseURL: "https://ohut-7a131-default-rtdb.firebaseio.com",
  projectId: "ohut-7a131",
  storageBucket: "ohut-7a131.firebasestorage.app",
  messagingSenderId: "287815822212",
  appId: "1:287815822212:web:b118b5f20a1a8845074bd1"
};
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();

    // Show signup form
    document.getElementById('show-signup-form').addEventListener('click', (event) => {
      event.preventDefault();
      document.getElementById('signin-form').style.display = 'none';
      document.getElementById('signup-form').style.display = 'block';
    });

    // Show signin form
    document.getElementById('show-signin-form').addEventListener('click', (event) => {
      event.preventDefault();
      document.getElementById('signin-form').style.display = 'block';
      document.getElementById('signup-form').style.display = 'none';
    });

// Signin
document.getElementById('signin-btn').addEventListener('click', () => {
  const email = document.getElementById('signin-email').value;
  const password = document.getElementById('signin-password').value;
  auth.signInWithEmailAndPassword(email, password)
    .then((userCredential) => {
      // Signed in
      window.location.href = 'dashboard.html'; // redirect to dashboard
    })
    .catch((error) => {
      console.error("Error signing in:", error);
    });
});

// Signup
document.getElementById('signup-btn').addEventListener('click', () => {
  const email = document.getElementById('signup-email').value;
  const password = document.getElementById('signup-password').value;
  const confirmPassword = document.getElementById('signup-confirm-password').value;
  if (password === confirmPassword) {
    auth.createUserWithEmailAndPassword(email, password)
      .then((userCredential) => {
        // Signed up
        const user = userCredential.user;
        db.ref(`users/${user.uid}`).set({
          email: email,
          // Add other user data here
        })
        .then(() => {
          console.log("User data saved!");
          window.location.href = 'home.html'; // redirect to dashboard
        })
        .catch((error) => {
          console.error("Error saving user data:", error);
        });
      })
      .catch((error) => {
        console.error("Error signing up:", error);
      });
  } else {
    console.error("Passwords do not match");
  }
});
</script>
</body>
</html>
